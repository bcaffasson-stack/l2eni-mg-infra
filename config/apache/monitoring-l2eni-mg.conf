<VirtualHost *:443>
    ServerName monitoring.l2eni.mg
    SSLEngine on
    SSLCertificateFile /etc/ssl/l2eni/server.crt
    SSLCertificateKeyFile /etc/ssl/l2eni/server.key
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
