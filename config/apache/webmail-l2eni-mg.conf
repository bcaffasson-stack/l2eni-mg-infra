# VirtualHost for webmail.l2eni.mg
<VirtualHost *:80>
    ServerName webmail.l2eni.mg
    Redirect permanent / https://webmail.l2eni.mg/
</VirtualHost>

<VirtualHost *:443>
    ServerName webmail.l2eni.mg
    SSLEngine on
    SSLCertificateFile /etc/ssl/l2eni/server.crt
    SSLCertificateKeyFile /etc/ssl/l2eni/server.key
    DocumentRoot /var/lib/roundcube

    <Directory /var/lib/roundcube>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/webmail>
        Options +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /etc/roundcube>
        Require all denied
    </Directory>

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/webmail-error.log
    CustomLog ${APACHE_LOG_DIR}/webmail-access.log combined
</VirtualHost>
